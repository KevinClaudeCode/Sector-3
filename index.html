<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MFC: Sector 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#000;--ink:#d6d9d3;--dim:#80868a;--danger:#c8322b;--water:#3fa9f5;--brass:#c9a54a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--void:#000;--ink:#d6d9d3}}
:root[data-theme="dark"]{--void:#000;--ink:#d6d9d3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);overflow:hidden;font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif}
canvas{display:block;cursor:none;touch-action:none}
button{font:inherit;font-weight:600;font-size:1.05rem;color:#0a0a0a;background:var(--ink);border:0;padding:.7rem 1.6rem;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
button:hover{background:#fff}
button:focus-visible{outline:3px solid var(--water);outline-offset:3px}

/* full-screen menus */
.screen{position:fixed;inset:0;display:flex;overflow-y:auto;padding:24px;z-index:10;
  background:radial-gradient(ellipse at 30% 60%,rgba(242,236,216,0.07),transparent 55%),rgba(0,0,0,0.82)}
.screen[hidden]{display:none}
.card{max-width:34rem;width:100%;margin:auto}
.card h1{font-size:clamp(2.6rem,8vw,4.4rem);font-weight:700;margin:0 0 .2em;letter-spacing:.02em;line-height:1}
.card .who{color:var(--dim);margin:0 0 1.4rem;font-size:1rem}
.card p{line-height:1.55;margin:0 0 1rem;font-size:1.02rem}
.keys{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.1rem;margin:1.2rem 0 1.8rem;color:var(--dim);font-size:.95rem}
.keys b{color:var(--ink);font-weight:600}
.stats{color:var(--dim);margin-bottom:1.6rem}
.stats b{color:var(--ink)}
body:not(.touch) .touch-only{display:none!important}
body.touch .mouse-only{display:none!important}

/* touch controls */
#touchUI{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:4}
body:not(.playing) #touchUI, body.invopen #touchUI, body.cookopen #touchUI{display:none}
.tbtn{width:48px;height:48px;border-radius:50%;padding:0;clip-path:none;font-size:.72rem;color:var(--ink);
  background:rgba(214,217,211,0.12);border:1px solid rgba(214,217,211,0.35);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tbtn:hover{background:rgba(214,217,211,0.2)}
.tbtn.big{width:58px;height:58px;font-size:.8rem;border-color:rgba(201,165,74,0.7)}
.ctx{position:fixed;left:50%;transform:translateX(-50%);clip-path:none;border-radius:999px;padding:.6rem 1.4rem;font-size:.9rem;
  touch-action:manipulation;box-shadow:0 0 0 1px rgba(0,0,0,0.5);z-index:4}
#tPick{bottom:calc(86px + env(safe-area-inset-bottom));background:#e6e8e2;color:#0a0a0a}
#tDoor{bottom:calc(138px + env(safe-area-inset-bottom));background:var(--brass);color:#0a0a0a}
body:not(.playing) .ctx{display:none}
@media (orientation:landscape){body.touch.invopen .ctx{left:26%}body.touch.cookopen .ctx{left:74%}body.touch.cookopen.invopen .ctx{left:50%}}
@media (orientation:portrait){body.touch.cookopen #tPick{bottom:calc(64vh + 10px)}body.touch.cookopen #tDoor{bottom:calc(64vh + 62px)}}
@media (orientation:portrait){body.touch.invopen #tPick{bottom:calc(64vh + 10px)}body.touch.invopen #tDoor{bottom:calc(64vh + 62px)}}

/* inventory panel: the world keeps running behind it */
#invPanel{overflow-x:hidden;position:fixed;right:16px;top:16px;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 32px);
  overflow-y:auto;background:#0e1012;border:1px solid #33383c;padding:14px 16px 16px;z-index:5;cursor:default}
#invPanel[hidden]{display:none}
body.touch #invPanel{top:8px;bottom:8px;transform:none;max-height:none;width:min(380px,48vw);right:8px}
@media (orientation:portrait){body.touch #invPanel{left:0;right:0;top:auto;bottom:0;width:auto;height:64vh;border-width:1px 0 0}}
.invHead{display:flex;align-items:center;gap:.8rem;margin-bottom:6px}
.invHead h2{margin:0;font-size:1.35rem;font-weight:700;flex:1}
.ghost{background:transparent;color:var(--ink);border:1px solid #4a5055;clip-path:none;padding:.4rem .9rem;font-size:.85rem}
.ghost:hover{background:rgba(214,217,211,0.1)}
.secHead{font-size:.92rem;font-weight:600;margin:12px 0 6px;display:flex;justify-content:space-between;gap:8px}
.secHead span{color:var(--dim);font-weight:400;text-align:right}
.secHead span.warn{color:var(--brass)}
.beltGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bagGrid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.4fr)}
.cell{padding:4px}
.slot{clip-path:none;width:100%;aspect-ratio:1;background:#1b1e21;border:1px solid
